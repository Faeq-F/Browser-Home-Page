<!DOCTYPE html>

<html lang="{{ site.locale | default: 'en' }}">
<!--<![endif]-->

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title | default: 'Home' }}</title>
  <meta name="description"
    content="{{ page.description | default: site.description | default: 'The Homepage' }}" />
  <link rel="icon" href="{{ site.baseurl }}/Icon.png" type="image/png" />
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css" />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="{{ site.baseurl }}/Clock.js"></script>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body onload="checkCookie()">
  {{ content }}

  <!-- Include settings modules in order -->
  <script src="{{ site.baseurl }}/js/settings-config.js"></script>
  <script src="{{ site.baseurl }}/js/settings-management.js"></script>
  <script src="{{ site.baseurl }}/js/theme-application.js"></script>
  <script src="{{ site.baseurl }}/js/font-management.js"></script>
  <script src="{{ site.baseurl }}/js/combobox-ui.js"></script>
  <script src="{{ site.baseurl }}/js/settings-init.js"></script>
  <script>
    getTime();
  </script>
  <script src="{{ site.baseurl }}/search.js"></script>
</body>

</html>
