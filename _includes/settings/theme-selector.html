<!-- Theme Component -->
<div class="settings-section">
  <h4>Theme</h4>
  <div class="theme-setting">
    <div class="combobox-container" data-id="themeSelect">
      <input type="text" class="combobox-search" placeholder="Search themes..."
        autocomplete="off">
      <div class="combobox-dropdown"></div>
      <input type="hidden" id="themeSelect" value="light">
      <div class="selected-value">Light Theme</div>
    </div>
  </div>
</div>
