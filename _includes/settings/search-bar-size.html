<!-- Search Bar Size Settings Component -->
<div class="settings-section">
  <h4>Search Bar Width (%)</h4>
  <div class="setting-item">
    <input type="number" id="searchBarWidth" class="combobox-input" min="20"
      max="100" value="90" step="5">
  </div>

  <h4>Search Bar Height (px)</h4>
  <div class="setting-item">
    <input type="number" id="searchBarHeight" class="combobox-input" min="30"
      max="80" value="48" step="2">
  </div>
</div>
