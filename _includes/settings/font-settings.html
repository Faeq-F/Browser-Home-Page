<!-- Font Settings Component -->
<div class="settings-section">
  <h4>Font Settings</h4>
  <div class="font-setting">
    <div class="combobox-container" data-id="fontFamily" data-type="font">
      <input type="text" id="fontSearch" class="combobox-search"
        placeholder="Search Google Fonts..." autocomplete="off">
      <div id="fontDropdown" class="combobox-dropdown"></div>
      <input type="hidden" id="fontFamily" value="Chivo Mono">
      <div id="selectedFont" class="selected-value">Chivo Mono</div>
    </div>
  </div>
</div>
