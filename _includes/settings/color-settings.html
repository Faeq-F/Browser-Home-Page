<!-- Color Settings Component -->
<div class="settings-section" id="colorSettingsSection" style="display: none;">
  <h4>Custom Colors</h4>
  <div class="setting-item">
    <label for="bgColor">Background</label>
    <input type="color" id="bgColor" value="#f8f9fa">
  </div>
  <div class="setting-item">
    <label for="textColor">Text</label>
    <input type="color" id="textColor" value="#212529">
  </div>
  <div class="setting-item">
    <label for="borderColor">Border</label>
    <input type="color" id="borderColor" value="#dee2e6">
  </div>
  <div class="setting-item">
    <label for="accentColor">Accent</label>
    <input type="color" id="accentColor" value="#000000">
  </div>
  <div class="setting-item">
    <label for="searchIconColor">Search Icon</label>
    <input type="color" id="searchIconColor" value="#ffffff">
  </div>
  <button id="resetColors" class="reset-btn">Reset to Theme Defaults</button>
</div>
