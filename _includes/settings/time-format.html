<!-- Time Format Component -->
<div class="settings-section">
  <h4>Time Format</h4>
  <div class="time-format-setting">
    <div class="combobox-container" data-id="timeFormat">
      <input type="text" class="combobox-search" placeholder="Search formats..."
        autocomplete="off">
      <div class="combobox-dropdown"></div>
      <input type="hidden" id="timeFormat" value="HH:mm">
      <div class="selected-value">24-Hour (14:30)</div>
    </div>
  </div>
</div>
