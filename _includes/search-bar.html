<!-- Search Bar Component -->
<div class="wrap">
  <div class="search">
    <input type="text" class="searchTerm" id="searchField" placeholder="{{ include.placeholder | default: 'Search...' }}" />
    <button type="submit" class="searchButton" id="searchButton" aria-label="Search">
      <i class="fa fa-search" id="searchIcon"></i>
    </button>
  </div>
</div>
